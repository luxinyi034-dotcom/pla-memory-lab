<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>风格选项</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Serif&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" />
<style>
/* One layout, four themes. Only tokens change. */
:root[data-theme="paper"]{--bg:#FAF8F4;--surface:#FAF8F4;--ink:#1C1B19;--soft:#77736C;--faint:#B3ADA4;--line:#E3DED5;--accent:#9E3B2B;--on-accent:#FAF8F4;--track:#E9E4DB;
  --display:"Newsreader",Georgia,serif;--zh-display:"Noto Serif SC",serif;--body:Inter,"PingFang SC",system-ui,sans-serif;--card-bg:transparent;--card-border:none;--radius:0px;--shadow:none;--rule:1px solid var(--line);--h1w:500;--num-w:400}
:root[data-theme="soft"]{--bg:#F3F2EF;--surface:#FFFFFF;--ink:#1D1D1F;--soft:#6E6E73;--faint:#A1A1A6;--line:#E7E6E2;--accent:#3F6B57;--on-accent:#FFFFFF;--track:#E8E7E3;
  --display:Inter,"PingFang SC",system-ui,sans-serif;--zh-display:Inter,"PingFang SC",system-ui,sans-serif;--body:Inter,"PingFang SC",system-ui,sans-serif;--card-bg:#FFFFFF;--card-border:none;--radius:22px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);--rule:1px solid var(--line);--h1w:600;--num-w:600}
:root[data-theme="mist"]{--bg:#EEF1F4;--surface:#F7F9FB;--ink:#1B2437;--soft:#5F6B7E;--faint:#9AA4B3;--line:#DCE2EA;--accent:#2E4A7D;--on-accent:#F7F9FB;--track:#DCE2EA;
  --display:"Instrument Serif",Georgia,serif;--zh-display:"Noto Serif SC",serif;--body:Inter,"PingFang SC",system-ui,sans-serif;--card-bg:#F7F9FB;--card-border:1px solid #DCE2EA;--radius:14px;--shadow:none;--rule:1px solid var(--line);--h1w:500;--num-w:400}
:root[data-theme="clay"]{--bg:#F2EDE6;--surface:#F8F4EE;--ink:#2B2522;--soft:#80766F;--faint:#B5AAA1;--line:#E2D9CE;--accent:#B0603F;--on-accent:#FBF7F1;--track:#E5DCD1;
  --display:"Fraunces",Georgia,serif;--zh-display:"Noto Serif SC",serif;--body:Inter,"PingFang SC",system-ui,sans-serif;--card-bg:#F8F4EE;--card-border:none;--radius:18px;--shadow:none;--rule:1px solid var(--line);--h1w:600;--num-w:400}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
.app{display:grid;grid-template-columns:212px 1fr;height:100vh}
aside{padding:44px 26px 32px 34px;display:flex;flex-direction:column;border-right:var(--rule)}
.brand{font-family:var(--display);font-size:21px;letter-spacing:-.01em;margin-bottom:46px}
.brand span{color:var(--accent)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;height:38px;color:var(--soft);font-size:14.5px;position:relative}
nav a.on{color:var(--ink);font-weight:500}
nav a.on::before{content:"";position:absolute;left:-14px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
nav a small{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
nav a.on small{color:var(--accent)}
aside .foot{margin-top:auto;font-size:12px;color:var(--faint);line-height:1.7}
aside .foot b{display:block;font-family:var(--display);font-weight:var(--num-w);font-size:26px;color:var(--ink);line-height:1.1}
main{padding:46px 60px 40px;overflow:hidden;display:flex;flex-direction:column}
.date{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
h1{margin:0;font-family:var(--zh-display);font-weight:var(--h1w);font-size:42px;line-height:1.1;letter-spacing:.01em}
.progress-meta{font-size:13.5px;color:var(--soft);text-align:right}
.progress-meta b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--track);border-radius:2px;margin:22px 0 30px;overflow:hidden}
.bar i{display:block;height:100%;width:36%;background:var(--accent);border-radius:2px}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.task{background:var(--card-bg);border:var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px;display:flex;flex-direction:column;min-height:214px}
[data-theme="paper"] .task{padding:4px 0 0;border-top:1px solid var(--ink)}
[data-theme="paper"] .task + .task{padding-left:0}
.task .label{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}
.task .num{font-family:var(--display);font-weight:var(--num-w);font-size:76px;line-height:1;margin:18px 0 6px;letter-spacing:-.03em;font-variant-numeric:lining-nums}
[data-theme="soft"] .task .num{font-size:64px;letter-spacing:-.045em}
.task .sub{font-size:14px;color:var(--soft)}
.task .act{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:14px}
.btn{height:44px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;border:1px solid var(--ink);color:var(--ink);background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
[data-theme="paper"] .btn{border-radius:2px}
.btn svg{width:14px;height:14px}
.chips{display:flex;gap:6px}
.chip{font-size:12.5px;color:var(--soft);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.on{color:var(--ink);border-color:var(--ink)}
.list{margin-top:34px}
.list-head{display:flex;align-items:baseline;gap:22px;padding-bottom:12px;border-bottom:var(--rule)}
.list-head h2{margin:0;font-family:var(--zh-display);font-weight:var(--h1w);font-size:19px}
.list-head span{font-size:13.5px;color:var(--faint)}
.list-head span.on{color:var(--ink)}
.list-head .r{margin-left:auto}
.row{display:grid;grid-template-columns:1fr 70px 70px 56px;align-items:center;height:48px;border-bottom:var(--rule);font-size:14.5px}
.row .n{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.row .m{font-variant-numeric:tabular-nums;text-align:right;color:var(--soft)}
.row .s{font-size:12.5px;text-align:right}
.row .s.done{color:var(--accent)}
.row .s.todo{color:var(--faint)}
.swatches{position:fixed;right:22px;bottom:18px;display:flex;gap:6px}
.swatches i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">PLA<span>.</span> Lab</div>
    <nav>
      <a class="on">今日学习 <small>109</small></a><a>表达库 <small>546</small></a><a>掌握与计划</a><a>快速刷词</a><a>我的收藏 <small>3</small></a><a>打卡日历</a><a>设置</a>
    </nav>
    <div class="foot"><b>2</b>天连续打卡<br />累计 12 天</div>
  </aside>
  <main>
    <div class="date">Friday · 16 October</div>
    <div class="head"><h1>今日学习</h1><div class="progress-meta">已完成 <b>46 / 129</b> · 约 70 分钟</div></div>
    <div class="bar"><i></i></div>
    <section class="tasks">
      <div class="task">
        <div class="label"><span>到期复习</span><span>25 组</span></div>
        <div class="num">109</div>
        <div class="sub">按最早学习时间排列，先认读，再整组默写</div>
        <div class="act"><span class="btn primary">开始复习 <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
      </div>
      <div class="task">
        <div class="label"><span>今日新学</span><span>4 组</span></div>
        <div class="num">20</div>
        <div class="sub">按最早导入顺序推荐完整分组</div>
        <div class="act"><span class="btn">选择新学</span><span class="chips"><span class="chip">表达</span><span class="chip on">词汇</span></span></div>
      </div>
    </section>
    <section class="list">
      <div class="list-head"><h2>今日词表</h2><span class="on">全部</span><span>错词 3</span><span class="r">全部展开</span></div>
      <div class="row"><span>改变观点</span><span class="n">4 条</span><span class="m">96%</span><span class="s done">已复习</span></div>
      <div class="row"><span>证明观点可信</span><span class="n">5 条</span><span class="m">87%</span><span class="s done">已复习</span></div>
      <div class="row"><span>批判 / 攻击</span><span class="n">5 条</span><span class="m">86%</span><span class="s todo">待复习</span></div>
      <div class="row"><span>揭露</span><span class="n">6 条</span><span class="m">80%</span><span class="s todo">待复习</span></div>
    </section>
  </main>
</div>
<script>
const theme = new URLSearchParams(location.search).get('theme') || 'paper';
document.documentElement.dataset.theme = theme;
</script>
</body>
</html>
